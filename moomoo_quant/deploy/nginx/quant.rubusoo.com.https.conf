server {
    listen 80;
    listen [::]:80;
    server_name quant.rubusoo.com;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quant.rubusoo.com;

    ssl_certificate /etc/letsencrypt/live/quant.rubusoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quant.rubusoo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:quant_tls:10m;
    ssl_session_timeout 1d;

    auth_basic "Moomoo Quant Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-moomoo-quant;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
